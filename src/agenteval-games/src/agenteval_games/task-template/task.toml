version = "1.0"

[task]
name = "agentgym/{task_id}"
authors = [{ name = "Zhiheng Xi" }, { name = "Yiwen Ding" }, { name = "Wenxiang Chen" }, { name = "AgentGym contributors" }, { name = "Charlie Snell and LMRL-Gym contributors" }]

[metadata]
difficulty = "medium"
category = "games"
tags = ["agenteval", "agentgym", "{game}", "interactive"]
upstream_item_id = "{upstream_id}"

[agent]
timeout_sec = 1800.0

[verifier]
timeout_sec = 120.0

[environment]
build_timeout_sec = 600.0
cpus = 1
memory_mb = 1024
storage_mb = 2048

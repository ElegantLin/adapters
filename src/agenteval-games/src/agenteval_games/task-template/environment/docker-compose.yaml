services:
  game:
    build:
      context: ${CONTEXT_DIR}
      dockerfile: Dockerfile.game
    image: ${MAIN_IMAGE_NAME}_game
    volumes:
      - game-public:/game-public
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/observation',timeout=2)"]
      interval: 1s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
  main:
    build:
      context: ${CONTEXT_DIR}
      dockerfile: Dockerfile
    image: ${MAIN_IMAGE_NAME}
    command: ["sh", "-c", "sleep infinity"]
    depends_on:
      game:
        condition: service_healthy
    environment:
      - TEST_DIR=${TEST_DIR}
    volumes:
      - game-public:/game-public:ro
      - ${HOST_VERIFIER_LOGS_PATH}:${ENV_VERIFIER_LOGS_PATH}
      - ${HOST_AGENT_LOGS_PATH}:${ENV_AGENT_LOGS_PATH}
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY}
volumes:
  game-public:

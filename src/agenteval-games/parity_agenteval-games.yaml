# Prospective native parity configuration. Fill in the team-approved model and
# identical generation settings on both sides before any billable run.
# The numeric values below are examples, not approved experimental settings.
# Set temperature, max_tokens or top_p to null to leave that field out of the
# request, and use extra_body for provider-specific fields, for example:
#   a model that accepts temperature or top_p but not both:  top_p: null
#   a model that takes max_completion_tokens and fixed sampling:
#     temperature: null, max_tokens: null, top_p: null,
#     extra_body: {max_completion_tokens: 4096}
datasets:
  - path: /tmp/agenteval-games
agents:
  - import_path: agenteval_games.harbor_agent:AgentEvalNativeAgent
    model_name: TEAM_APPROVED_EXACT_MODEL_ID
    kwargs:
      temperature: 0.0
      max_tokens: 2048
      top_p: 1.0
      extra_body: {}
      request_timeout_sec: 120
      environment_timeout_sec: 30
      episode_timeout_sec: 1500
environment:
  type: docker
  delete: true
orchestrator:
  type: local
  n_concurrent_trials: 4
